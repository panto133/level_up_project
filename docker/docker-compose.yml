services:
  levelup_database:
    container_name: levelup
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: levelup_db
      TZ: "Europe/Belgrade"
    command: ['mysqld', '--default-time-zone=+01:00']
    volumes:
      - levelup_database_dat:/var/lib/mysql
volumes:
  levelup_database_dat:
    driver: local